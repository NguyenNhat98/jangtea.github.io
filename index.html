<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffe9ef" />
<title>Tiệm Trà Mơ Ước</title>
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/shop.css" />
<link rel="stylesheet" href="css/modal.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div id="app" class="app">
  <header id="hud" class="hud" aria-label="Thông tin tiệm"></header>

  <main id="shop" class="shop" aria-label="Tiệm trà">
    <div class="shop-scene" aria-hidden="true">
      <div class="scene-wall"></div>
      <div class="scene-window"><span class="scene-sky"></span></div>
      <div class="scene-shelf"><span>🫖</span><span>🍯</span><span>🌿</span><span>🧋</span></div>
      <div class="scene-board" data-board>Hôm nay<small>...</small></div>
      <div class="scene-plant">🪴</div>
      <div class="scene-cat">🐈</div>
      <div class="scene-floor"></div>
    </div>

    <section id="customerArea" class="customer-area" aria-label="Khách hàng"></section>

    <section id="counter" class="counter" aria-label="Quầy pha chế"></section>

    <div id="karinArea" class="karin-area"></div>

    <div id="shopActions" class="shop-actions" aria-label="Hành động"></div>
  </main>

  <nav id="bottomNav" class="bottom-nav" aria-label="Điều hướng"></nav>

  <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="modalRoot" class="modal-root"></div>
</div>

<script src="js/bundle.js"></script>
</body>
</html>
